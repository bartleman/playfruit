[package]
name = "playfruit-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "playfruit"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }
