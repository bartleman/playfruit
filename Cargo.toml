[workspace]
resolver = "2"
members = [
    "crates/airplay-core",
    "crates/audio-capture",
    "crates/playfruit-cli",
    "crates/playfruit-tray",
]
exclude = ["vendor"]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "GPL-2.0-or-later"
authors = ["Ricky"]
repository = "https://github.com/bartleman/playfruit"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdns-sd = "0.11"
ringbuf = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
